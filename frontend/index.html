<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Logistics Control Center</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- HEADER -->
        <header class="header">
            <h1>🚚 Smart Logistics Control Center</h1>
            <p>
                Real-Time Optimization • Traffic Simulation • Route Planning
            </p>
        </header>

        <!-- STATS -->
        <section class="stats">

            <div class="stat-card">
                <h3>Cities</h3>
                <span id="cityCount">0</span>
            </div>

            <div class="stat-card">
                <h3>Roads</h3>
                <span id="roadCount">0</span>
            </div>

            <div class="stat-card">
                <h3>Agents</h3>
                <span id="agentCount">0</span>
            </div>

            <div class="stat-card">
                <h3>Orders</h3>
                <span id="orderCount">0</span>
            </div>

        </section>

        <div class="main-grid">

            <!-- LEFT PANEL -->
            <div class="left-panel">

                <div class="panel">
                    <h2>📍 Cities</h2>
                    <textarea id="cities">Delhi
Noida
Gurgaon</textarea>
                </div>

                <div class="panel">
                    <h2>🛣 Roads</h2>
                    <textarea id="roads">Delhi Noida 10
Noida Gurgaon 15</textarea>
                </div>

                <div class="panel">
                    <h2>🚚 Agents</h2>
                    <textarea id="agents">Delhi 10
Noida 15</textarea>
                </div>

                <div class="panel">
                    <h2>📦 Orders</h2>
                    <textarea id="orders">Noida 4 5 3
Gurgaon 5 6 2</textarea>
                </div>

                <button
                    type="button"
                    class="run-btn"
                    id="runBtn">
                    🚀 Run Optimization
                </button>

            </div>

            <!-- RIGHT PANEL -->
            <div class="right-panel">

                <div class="panel">
                    <h2>📊 Optimization Results</h2>

                    <pre id="output">Run the simulation to see results...</pre>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js?v=3"></script>

</body>

</html>
